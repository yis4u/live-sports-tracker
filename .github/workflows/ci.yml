name: Verify application

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sideline
          POSTGRES_PASSWORD: qa_local_password
          POSTGRES_DB: sideline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sideline -d sideline_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://sideline:qa_local_password@127.0.0.1:5432/sideline_test
      TEST_DATABASE_URL: postgresql://sideline:qa_local_password@127.0.0.1:5432/sideline_test
      APP_ORIGIN: http://127.0.0.1:3000
      E2E_ACCOUNTS: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      API_SPORTS_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
      - run: npm run build
      - run: npm run build:site
      - run: npm run validate:site
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
