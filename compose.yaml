services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sideline
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: sideline
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sideline_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sideline -d sideline"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  sideline_postgres:
